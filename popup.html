<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Tabs</title>

  <style>
    :root {
      --color-gold: #b8882d;
      --color-gold-hover: #d19c33;
      --color-gold-light: #d4af37;
      --color-dark: #111111;
      --color-dark-hover: #222222;
      --color-accent: #1f1f1f;
      --color-accent-hover: #2a2a2a;
      --color-text-light: #ffffff;
      --color-text-dark: #000000;
      --color-bg-dark: #000000;
      --radius: 4px;
      --transition: 0.2s all ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
      width: 220px;
      background-color: var(--color-bg-dark);
      color: var(--color-text-light);
      padding: 8px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: var(--radius);
      font-weight: 500;
      font-size: 13px;
      color: var(--color-text-light);
      border: none;
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
      width: 100%;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 3px;
      background-color: currentColor;
      opacity: 0;
      transition: var(--transition);
    }

    .btn:hover::before {
      opacity: 1;
    }

    .btn:focus {
      outline: 2px solid var(--color-gold);
      outline-offset: 1px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-close {
      background-color: var(--color-dark);
    }

    .btn-close:hover {
      background-color: var(--color-dark-hover);
    }

    .btn-close::before {
      background-color: #ff3b30;
    }

    .btn-gather {
      background-color: var(--color-accent);
    }

    .btn-gather:hover {
      background-color: var(--color-accent-hover);
    }

    .btn-gather::before {
      background-color: var(--color-gold-light);
    }

    .btn-gather-all {
      background-color: var(--color-gold);
      color: var(--color-text-dark);
    }

    .btn-gather-all:hover {
      background-color: var(--color-gold-hover);
    }

    .btn-gather-all::before {
      background-color: #37d44f;
    }

    .btn-move {
      background-color: var(--color-accent);
    }

    .btn-move:hover {
      background-color: var(--color-accent-hover);
    }

    .btn-move::before {
      background-color: #007aff;
    }

    .icon {
      display: inline-flex;
      width: 14px;
      height: 14px;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .shortcut {
      margin-left: auto;
      font-size: 10px;
      opacity: 0.7;
      padding: 2px 4px;
      background-color: rgba(0, 0, 0, 0.2);
      border-radius: 3px;
      flex-shrink: 0;
    }

    .header {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--color-accent);
      padding-bottom: 4px;
    }

    .logo {
      font-weight: 700;
      font-size: 15px;
      color: var(--color-gold);
      letter-spacing: 0.5px;
    }

    .section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.5;
      margin: 8px 0 4px 0;
      padding-top: 8px;
      border-top: 1px solid var(--color-accent);
    }

    .footer {
      margin-top: 6px;
      font-size: 9px;
      text-align: center;
      padding-top: 4px;
      border-top: 1px solid var(--color-accent);
    }

    .footer a {
      color: var(--color-gold);
      text-decoration: none;
      opacity: 0.8;
      transition: var(--transition);
    }

    .footer a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    .move-row {
      display: flex;
      gap: 4px;
    }

    .move-row .btn {
      flex: 1;
      justify-content: center;
      padding: 8px 4px;
    }

    .move-row .btn .icon {
      margin: 0;
    }
  </style>

  <script src="popup.js" defer></script>
</head>
<body>
  <div class="header">
    <span class="logo">tabmgmt</span>
  </div>

  <div class="container">
    <button id="close-tabs" class="btn btn-close">
      <span class="icon">X</span>
      <span>Close Domain Tabs</span>
    </button>

    <button id="gather-tabs" class="btn btn-gather">
      <span class="icon">~</span>
      <span>Gather Around</span>
    </button>

    <button id="gather-tabs-all" class="btn btn-gather-all">
      <span class="icon">+</span>
      <span>Gather All Domains</span>
    </button>

    <div class="section-label">Move Tab</div>

    <div class="move-row">
      <button id="move-tab-start" class="btn btn-move" title="Move to start">
        <span class="icon">|&lt;</span>
      </button>
      <button id="move-tab-left" class="btn btn-move" title="Move left">
        <span class="icon">&lt;</span>
      </button>
      <button id="move-tab-right" class="btn btn-move" title="Move right">
        <span class="icon">&gt;</span>
      </button>
      <button id="move-tab-end" class="btn btn-move" title="Move to end">
        <span class="icon">&gt;|</span>
      </button>
    </div>
  </div>

  <div class="footer">
    <a href="#" id="open-shortcuts" title="Open keyboard shortcuts settings">Configure shortcuts</a>
  </div>

</body>
</html>
