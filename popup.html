<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabmgmt</title>

  <style>
    :root {
      --chassis: #121212;
      --key: #1f1f1f;
      --key-top: #262626;
      --key-hover: #2e2e2e;
      --lcd: #070707;
      --amber: #f0b030;
      --amber-dim: rgba(240, 176, 48, 0.55);
      --gold: #b8882d;
      --fg: #e8e8e8;
      --danger: #ff4a3d;
      --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 216px;
      padding: 6px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      color: var(--fg);
      background: var(--chassis);
    }

    /* LCD readout */
    .lcd {
      padding: 6px 8px;
      margin-bottom: 6px;
      font-family: var(--mono);
      color: var(--amber);
      background: var(--lcd);
      border: 1px solid #242424;
      border-radius: 5px;
      text-shadow: 0 0 3px rgba(240, 176, 48, 0.18);
    }

    .lcd-top,
    .lcd-sub {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 9px;
      letter-spacing: 0.4px;
      color: var(--amber-dim);
      text-transform: uppercase;
    }

    .logo {
      font-weight: 700;
      color: var(--amber);
    }

    .lcd-main {
      margin: 3px 0 2px;
      overflow: hidden;
      font-size: 11px;
      white-space: nowrap;
    }

    .lcd-main span {
      display: inline-block;
    }

    /* Long domains drift back and forth instead of being cut off. */
    .lcd-main.roll span {
      animation: roll var(--roll-time, 6s) ease-in-out infinite alternate;
    }

    @keyframes roll {
      0%, 20% { transform: translateX(0); }
      80%, 100% { transform: translateX(var(--roll-by, 0)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .lcd-main.roll span {
        animation: none;
      }
    }

    .gear {
      display: inline-flex;
      color: var(--amber-dim);
    }

    .gear:hover {
      color: var(--amber);
    }

    .gear:focus-visible {
      outline: 1px solid var(--amber);
      outline-offset: 1px;
    }

    .gear svg {
      width: 11px;
      height: 11px;
    }

    svg {
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Beveled keys */
    .keys {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: flex;
      gap: 4px;
    }

    .btn {
      display: flex;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      gap: 5px;
      width: 100%;
      min-width: 0;
      padding: 5px 6px;
      font: inherit;
      font-weight: 500;
      color: var(--fg);
      white-space: nowrap;
      cursor: pointer;
      background: linear-gradient(var(--key-top), var(--key));
      border: 1px solid #2c2c2c;
      border-radius: 5px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
      transition: background-color 0.12s, border-color 0.12s;
    }

    .btn:hover:not(:disabled) {
      background: linear-gradient(var(--key-hover), var(--key-top));
      border-color: #3a3a3a;
    }

    .btn:active:not(:disabled) {
      background: var(--key);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      transform: translateY(0.5px);
    }

    .btn:focus-visible {
      outline: 1px solid var(--amber);
      outline-offset: 0;
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .btn svg {
      flex: 0 0 auto;
      width: 12px;
      height: 12px;
      color: var(--amber);
    }

    .btn .label {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-close svg {
      color: var(--danger);
    }

    .btn-hot {
      color: #000;
      background: linear-gradient(#d4a23e, var(--gold));
      border-color: #9c7224;
    }

    .btn-hot:hover:not(:disabled) {
      background: linear-gradient(#e0b04a, #c9962f);
    }

    .btn-hot svg {
      color: #000;
    }

    .transport .btn {
      padding: 4px 0;
    }

    .transport .btn svg {
      fill: currentColor;
    }

    .btn-undo {
      color: var(--amber);
    }

    .status {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 10px;
      color: var(--danger);
    }

    .status:empty {
      display: none;
    }

    [hidden] {
      display: none !important;
    }
  </style>

  <script type="module" src="popup.js"></script>
</head>
<body>
  <div class="lcd">
    <div class="lcd-top">
      <span><span class="logo">tabmgmt</span> <span id="version"></span></span>
      <a href="#" id="open-shortcuts" class="gear" title="Keyboard shortcuts" aria-label="Keyboard shortcuts">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      </a>
    </div>
    <div class="lcd-main" id="domain-box"><span id="domain"></span></div>
    <div class="lcd-sub">
      <span id="sibling-count"></span>
      <span id="window-count"></span>
    </div>
  </div>

  <div class="keys">
    <button id="close-tabs" class="btn btn-close" type="button" title="Close same-domain tabs">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="label" id="close-label">Close Domain Tabs</span>
    </button>

    <div class="row">
      <button id="gather-tabs" class="btn" type="button" title="Gather same-domain tabs around active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h12M4 15h12M19 6v12"/></svg>
        <span class="label">Gather</span>
      </button>
      <button id="gather-tabs-all" class="btn btn-hot" type="button" title="Gather all tabs by domain">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        <span class="label">Gather All</span>
      </button>
    </div>

    <div class="row transport">
      <button id="move-tab-start" class="btn" type="button" title="Move to start" aria-label="Move tab to start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5v14M19 6l-9 6 9 6z"/></svg>
      </button>
      <button id="move-tab-left" class="btn" type="button" title="Move left" aria-label="Move tab left">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 6l-9 6 9 6z"/></svg>
      </button>
      <button id="move-tab-right" class="btn" type="button" title="Move right" aria-label="Move tab right">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 6l9 6-9 6z"/></svg>
      </button>
      <button id="move-tab-end" class="btn" type="button" title="Move to end" aria-label="Move tab to end">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14M5 6l9 6-9 6z"/></svg>
      </button>
    </div>

    <div id="undo-row" hidden>
      <button id="undo-close" class="btn btn-undo" type="button" title="Reopen the tabs just closed">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        <span class="label" id="undo-label">Undo</span>
      </button>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite"></div>
</body>
</html>
