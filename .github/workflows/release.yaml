name: Build and Release Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CWS_ITEM_ID: gobmdjdemnlkgfcgmhmmojgaebfediog

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VER="$(jq -r '.version' manifest.json)"
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Build extension
        run: make build

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tabmgmt-v${{ env.VERSION }}.zip
          name: Release v${{ env.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload + publish to Chrome Web Store
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          CWS_PUBLISHER_JSON: ${{ secrets.CWS_PUBLISHER_JSON }}
          VER: ${{ env.VERSION }}
        run: |
          set -eu
          pip install --quiet google-auth requests
          keyfile="$(mktemp)"
          printf '%s' "$CWS_PUBLISHER_JSON" > "$keyfile"
          TOKEN="$(python3 - "$keyfile" <<'PY'
          import sys
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          creds = service_account.Credentials.from_service_account_file(
              sys.argv[1],
              scopes=['https://www.googleapis.com/auth/chromewebstore'],
          )
          creds.refresh(Request())
          print(creds.token)
          PY
          )"
          shred -u "$keyfile" 2>/dev/null || rm -f "$keyfile"
          zip="tabmgmt-v${VER}.zip"
          upload_resp="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "x-goog-api-version: 2" \
            -X PUT -T "$zip" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/${CWS_ITEM_ID}")"
          echo "upload: $upload_resp"
          state="$(echo "$upload_resp" | python3 -c "import json,sys; print(json.load(sys.stdin).get('uploadState',''))")"
          if [ "$state" != "SUCCESS" ] && [ "$state" != "IN_PROGRESS" ]; then
            echo "::error::CWS upload failed, state=$state"
            exit 1
          fi
          publish_resp="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            -X POST \
            "https://www.googleapis.com/chromewebstore/v1.1/items/${CWS_ITEM_ID}/publish")"
          echo "publish: $publish_resp"

      - name: Upload artifact (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tabmgmt-v${{ env.VERSION }}
          path: tabmgmt-v${{ env.VERSION }}.zip
          if-no-files-found: error
